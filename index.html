<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga RT 01 RW 03 Pecangaan Kulon</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900">

            <div class="flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <a href="#beranda" class="font-black text-slate-900 text-lg tracking-tight hover:text-emerald-700 transition">
                    Portal Warga RT 01 RW 03
                </a>
                <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md font-semibold hidden sm:inline-block">
                    Pecangaan Kulon
                </span>
            </div>

            <div class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-600">
                <a href="#beranda" class="hover:text-emerald-700 transition">Beranda</a>
                <a href="#kegiatan" class="hover:text-emerald-700 transition">Kegiatan & Berita</a>
                <a href="#keuangan" class="hover:text-emerald-700 transition font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">Laporan Keuangan</a>
                <a href="#data-warga" class="hover:text-emerald-700 transition">Data Warga</a>

                <a href="#layanan" class="hover:text-emerald-700 transition">Aspirasi</a>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="bukaModalApi()" class="text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-gear"></i> Set API
                </button>
                <div id="badgeDbStatus" class="text-[11px] font-bold px-2.5 py-1 rounded-md bg-rose-100 text-rose-800 border border-rose-200 flex items-center gap-1">
                    <i class="fa-solid fa-circle-xmark"></i> DISCONNECTED
                </div>

        </div>
    </header>

        <!-- HERO SECTION -->
        <section id="beranda" class="space-y-6">
            <div class="space-y-3">
                <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full text-xs font-semibold text-emerald-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    SISTEM AKTIF & TERINTEGRASI SUPABASE
                </div>
                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-
